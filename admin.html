<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NuTriLeaf Console</title>
<link rel="icon" href="images/nutrileaf-logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5ee;--surface:#fff;--surface2:#f7f9f3;--ink:#132016;--muted:#5f6c5b;--line:#e2e8da;
  --brand:#245b22;--onbrand:#fff;--brand2:#78b82a;--lime:#94fc33;--gold:#eec803;--orange:#f0ad3d;--chili:#bf532d;
  --side:#0e2813;--sideink:#bcd3b4;--danger:#c2402a;--ok:#2f7d32;--warn:#b7791f;
  --r:18px;--shadow:0 1px 2px rgba(18,40,20,.05),0 10px 30px rgba(18,40,20,.06);
  --font:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0b120d;--surface:#121c15;--surface2:#172219;--ink:#e8f1e4;--muted:#94a58f;--line:#223226;
  --brand:#8fdc55;--onbrand:#0b120d;--side:#08100a;--sideink:#9db596;--danger:#ff7a63;--ok:#7fd14a;--warn:#f0ad3d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:700;font-size:.9rem;background:var(--brand);color:var(--onbrand);transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.soft{background:color-mix(in srgb,var(--brand2) 18%,transparent);color:var(--brand)}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:10px}
.btn.lg{padding:15px 22px;font-size:1rem;border-radius:14px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon-btn:hover{background:var(--surface2)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field>label,.lbl{font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:none;transition:.15s}
.input:focus{border-color:var(--brand2);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand2) 20%,transparent)}
.input.sm{padding:7px 10px;border-radius:10px;font-size:.85rem}
.search{position:relative;flex:1;min-width:200px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search .input{padding-left:38px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.8rem;display:inline-flex;gap:8px;align-items:center}
.chip b{font-weight:800;font-size:.72rem;background:var(--surface2);border-radius:999px;padding:1px 8px;color:var(--ink)}
.chip.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.chip.on b{background:rgba(255,255,255,.22);color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:700;font-size:.8rem;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--onbrand)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill[class*=st-],.pill.ok,.pill.warn,.pill.bad,.pill.info{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.pill.ok{--c:var(--ok)}.pill.warn{--c:var(--warn)}.pill.bad{--c:var(--danger)}.pill.info{--c:#3b82f6}
.st-New{--c:#d98a0b}.st-Confirmed{--c:#3b82f6}.st-Packed{--c:#8b5cf6}.st-Shipped{--c:#0ea5a5}.st-Delivered{--c:var(--ok)}.st-Cancelled{--c:#8a8f87}
.st-Replied{--c:#3b82f6}.st-Closed{--c:#8a8f87}.st-InProgress{--c:#d98a0b}
[data-theme=dark] .st-New{--c:#f0ad3d}[data-theme=dark] .st-Confirmed{--c:#6aa5ff}[data-theme=dark] .st-Packed{--c:#b497ff}[data-theme=dark] .st-Shipped{--c:#4fd1d1}[data-theme=dark] .st-Cancelled{--c:#9aa096}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-art{background:radial-gradient(circle at 20% 15%,rgba(148,252,51,.35),transparent 45%),linear-gradient(160deg,#0e2813,#1d4a1c 60%,#2d6a24);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h2{font-size:clamp(2rem,3.6vw,3.2rem);line-height:1.05;letter-spacing:-.03em;max-width:12ch}
.login-art h2 em{font-style:normal;color:var(--lime)}
.login-art p{color:#cfe3c8;max-width:38ch;margin-top:14px}
.login-art .dots{position:absolute;right:-60px;bottom:-60px;width:320px;height:320px;border-radius:50%;border:2px solid rgba(255,255,255,.12);box-shadow:0 0 0 40px rgba(255,255,255,.04),0 0 0 90px rgba(255,255,255,.03)}
.login-form{display:grid;place-items:center;padding:30px}
.login-card{width:min(400px,100%)}
.login-card img{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow);margin-bottom:22px}
.login-card h1{font-size:1.7rem;letter-spacing:-.03em}
.login-card .sub{color:var(--muted);margin:6px 0 26px}
.check{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:4px 0 18px}
.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);padding:10px 12px;border-radius:12px;font-weight:700;font-size:.85rem;margin-top:14px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--sideink);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 10px}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.brand strong{display:block;color:#fff;font-size:1.02rem;letter-spacing:-.01em}
.brand span{font-size:.72rem;color:var(--sideink)}
#nav{display:grid;gap:4px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:transparent;color:var(--sideink);font-weight:700;font-size:.92rem;text-align:left;position:relative;width:100%}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{background:rgba(148,252,51,.13);color:var(--lime)}
.navbtn.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--lime)}
.badge{margin-left:auto;background:var(--orange);color:#2b1a00;font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.badge.red{background:var(--danger);color:#fff}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:.78rem}
.side-foot .kbd{background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;color:#fff;font-weight:700}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:40;height:68px;display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,36px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.25rem;letter-spacing:-.02em;margin-right:auto}
.qf{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;color:var(--muted);min-width:230px;font-size:.85rem}
.qf kbd{margin-left:auto;font:inherit;font-size:.7rem;font-weight:800;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.content{padding:26px clamp(16px,3vw,36px) 60px;max-width:1500px}
.bottom{display:none}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card h3{font-size:1rem;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g-2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-h h2{font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:-.03em;line-height:1.1}
.page-h p{color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.kpi{position:relative;overflow:hidden}
.kpi .l{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:.8rem}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand2) 18%,transparent);color:var(--brand)}
.kpi .v{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px}
.kpi .d{font-size:.78rem;font-weight:700;color:var(--muted)}
.d.up{color:var(--ok)}.d.down{color:var(--danger)}
.kpi.hot{background:linear-gradient(135deg,#1d4a1c,#2f7d32);color:#fff;border:0}
.kpi.hot .l,.kpi.hot .d{color:#d8ecd0}.kpi.hot .ic{background:rgba(255,255,255,.18);color:#fff}
.empty{text-align:center;color:var(--muted);padding:34px 14px}
.empty .i{width:34px;height:34px;margin-bottom:8px;opacity:.6}
.empty strong{display:block;color:var(--ink);margin-bottom:3px}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.click{cursor:pointer;border-radius:10px}
.li.click:hover{background:var(--surface2)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:color-mix(in srgb,var(--brand2) 22%,transparent);color:var(--brand);flex:0 0 auto}
.alert-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--c,#d98a0b) 18%,transparent);color:var(--c,#d98a0b)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand2)}
.bar.low>i{background:var(--danger)}
.legend{display:grid;gap:8px;margin-top:12px;font-size:.85rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend span:last-child{margin-left:auto;font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.skel{border-radius:12px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- orders ---------- */
.orow{display:grid;grid-template-columns:130px minmax(0,1.3fr) minmax(0,1.3fr) 150px 190px;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.orow:first-child{border-top:0}.orow:hover{background:var(--surface2)}
.orow .t{font-weight:700}.orow .s{font-size:.8rem;color:var(--muted)}
.orow .st{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ohead{display:grid;grid-template-columns:130px minmax(0,1.3fr) minmax(0,1.3fr) 150px 190px;gap:14px;padding:12px 16px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface2);border-radius:var(--r) var(--r) 0 0}
.tcard{padding:0;overflow:hidden}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px}
.col h4{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;margin-bottom:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.bcard .t{font-weight:800}.bcard .s{font-size:.8rem;color:var(--muted)}
.bcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}

/* ---------- drawer / modal / palette / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,8,.55);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:100;transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.drawer-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:1.15rem;letter-spacing:-.02em}
.drawer-b{padding:20px;overflow:auto;flex:1;display:grid;gap:18px;align-content:start}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sec{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface2)}
.sec h5{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.9rem}
.kv span:first-child{color:var(--muted)}
.kv.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:1.05rem}
.steps{display:flex;gap:4px}
.steps div{flex:1;text-align:center;font-size:.66rem;font-weight:800;color:var(--muted)}
.steps div::before{content:"";display:block;height:6px;border-radius:99px;background:var(--line);margin-bottom:6px}
.steps div.done::before{background:var(--brand2)}
.steps div.cur{color:var(--brand)}
.steps div.cur::before{background:var(--brand)}
.modal{position:fixed;inset:0;z-index:110;display:none;place-items:center;padding:18px}
.modal.on{display:grid}
.modal-c{background:var(--surface);border-radius:22px;padding:26px;width:min(440px,100%);box-shadow:0 30px 90px rgba(0,0,0,.35);text-align:center}
.modal-c .big{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.modal-c .big .i{width:30px;height:30px}
.palette{position:fixed;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(6,14,8,.55)}
.palette.on{display:flex}
.pal-c{background:var(--surface);border-radius:18px;width:min(620px,100%);box-shadow:0 30px 90px rgba(0,0,0,.4);overflow:hidden}
.pal-c input{width:100%;border:0;padding:18px 20px;font-size:1.05rem;background:transparent;outline:none;border-bottom:1px solid var(--line)}
.pal-r{max-height:50vh;overflow:auto;padding:8px}
.pal-i{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer}
.pal-i:hover,.pal-i.sel{background:var(--surface2)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:10px;max-width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:.88rem;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
.toast.err{background:var(--danger);color:#fff}.toast.ok{background:var(--ok);color:#fff}
[data-theme=dark] .toast.ok{color:#08100a}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px;box-shadow:var(--shadow);transition:.15s;min-height:190px;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--c,var(--brand2))}
.tile:active{transform:scale(.98)}
.tile .sw{width:46px;height:46px;border-radius:14px;background:var(--c,var(--brand2));display:grid;place-items:center;color:#fff}
.tile .n{font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.tile .p{font-weight:800;color:var(--brand);font-size:1.05rem}
.tile .q{position:absolute;top:12px;right:12px;background:var(--c,var(--brand2));color:#fff;border-radius:999px;font-weight:800;min-width:30px;height:30px;display:grid;place-items:center;padding:0 9px}
.tile.out{opacity:.45;pointer-events:none}
.ticket{position:sticky;top:84px}
.tline{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tline:first-child{border-top:0}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.qty button:hover{background:var(--surface2)}
.qty b{min-width:22px;text-align:center}
.paytog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.paytog button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:800}
.paytog button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand2) 14%,transparent);color:var(--brand)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.change{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:14px;padding:12px 14px;font-weight:800}
.change.short strong{color:var(--danger)}.change strong{font-size:1.3rem;color:var(--ok)}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0;font-weight:800}
.grand strong{font-size:2rem;letter-spacing:-.03em}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 12px;background:var(--surface2);white-space:nowrap}
.tbl td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}

async function authCall(grant,body){
  const r=await fetch(SB+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'Unable to sign in.');
  return j;
}
function saveSession(j,remember){
  SESSION={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||(Date.now()/1000+(j.expires_in||3600)),email:(j.user&&j.user.email)||(SESSION&&SESSION.email)||''};
  const keep=remember!==undefined?remember:!!localStorage.getItem(SKEY);
  localStorage.removeItem(SKEY);sessionStorage.removeItem(SKEY);
  (keep?localStorage:sessionStorage).setItem(SKEY,JSON.stringify(SESSION));
}
function loadSession(){try{return JSON.parse(localStorage.getItem(SKEY)||sessionStorage.getItem(SKEY)||'null');}catch(_){return null;}}
function clearSession(){SESSION=null;localStorage.removeItem(SKEY);sessionStorage.removeItem(SKEY);}
async function refreshToken(){
  if(refreshing) return refreshing;
  refreshing=(async()=>{
    if(!SESSION||!SESSION.refresh_token) throw new Error('Session expired. Please sign in again.');
    const j=await authCall('refresh_token',{refresh_token:SESSION.refresh_token});
    saveSession(j);
  })().finally(()=>{refreshing=null;});
  return refreshing;
}
async function token(){
  if(!SESSION) throw new Error('Not signed in.');
  if(SESSION.expires_at-Date.now()/1000<60) await refreshToken();
  return SESSION.access_token;
}
async function api(path,o){
  o=o||{};
  const t=await token(), method=o.method||'GET';
  const h={apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'};
  if(method!=='GET'&&!path.startsWith('rpc/')) h.Prefer=o.prefer||'return=minimal';
  const r=await fetch(SB+'/rest/v1/'+path,{method:method,headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(_){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint||j.error_description))||('Request failed ('+r.status+')'));
  return j;
}

  ];
  const res=await Promise.allSettled(jobs.map(j=>api(j[1])));
  const errs=[];
  res.forEach((r,i)=>{
    if(r.status==='fulfilled') S[jobs[i][0]]=Array.isArray(r.value)?r.value:[];
    else errs.push(jobs[i][0]+': '+r.reason.message);
  });
  S.errors=errs;
  /* detect brand-new orders */
  const ids=new Set(S.orders.map(o=>o.id));
  if(S.knownIds){
    const fresh=S.orders.filter(o=>!S.knownIds.has(o.id)&&o.status==='New');
    if(fresh.length){
      fresh.slice(0,3).forEach(o=>toast('New order '+o.order_no+' · '+o.customer_name+' · '+peso(o.total),'ok'));
      if(localStorage.getItem(SNKEY)!=='off') beep();
    }
  }
  S.knownIds=ids;S.loaded=true;
}
const pname=id=>{const p=S.products.find(x=>x.id===id);return p?p.name:String(id||'');};

const sumExp=(from,to)=>S.expenses.filter(x=>{const t=dateOnly(x.spent_on);return t>=from&&t<to;}).reduce((a,x)=>a+Number(x.amount||0),0);

function calc(){
  const now=new Date(),t0=sod(now),t1=addDays(t0,1),y0=addDays(t0,-1),w0=addDays(t0,-6),pw0=addDays(t0,-13);
  const m0=new Date(now.getFullYear(),now.getMonth(),1),pm0=new Date(now.getFullYear(),now.getMonth()-1,1);
  const pmEnd=new Date(pm0.getTime()+(t1-m0));
  const cur={today:sumOrders(t0,t1),week:sumOrders(w0,t1),month:sumOrders(m0,t1)};
  const prev={today:sumOrders(y0,t0),week:sumOrders(pw0,w0),month:sumOrders(pm0,pmEnd)};
  const paidMonth=sumOrders(m0,t1,true),expMonth=sumExp(m0,t1);
  const unpaid=S.orders.filter(o=>valid(o)&&o.payment_status!=='Paid');
  return {cur,prev,paidMonth,expMonth,profit:paidMonth-expMonth,
    unpaidCount:unpaid.length,unpaidAmt:unpaid.reduce((a,o)=>a+Number(o.total||0),0),
    toConfirm:S.orders.filter(o=>o.status==='New').length,
    ordersMonth:S.orders.filter(o=>valid(o)&&new Date(o.created_at)>=m0).length,m0,t1};
}
function dailySeries(days,from){
  const t0=from?sod(from):addDays(sod(new Date()),-(days-1)),out=[];
  for(let i=0;i<days;i++){const d=addDays(t0,i);out.push({d:d,v:0,n:0});}
  const idx={};out.forEach((x,i)=>{idx[dk(x.d)]=i;});
  S.orders.forEach(o=>{if(!valid(o))return;const k=dk(o.created_at);if(k in idx){out[idx[k]].v+=Number(o.total||0);out[idx[k]].n++;}});
  return out;
}
function customers(){
  const map={};
  S.orders.forEach(o=>{
    if(!valid(o)) return;
    const key=digits(o.phone).slice(-10)||String(o.email||'').toLowerCase()||String(o.customer_name||'').toLowerCase();
    if(!key||String(o.customer_name||'').toLowerCase()==='walk-in customer'&&!digits(o.phone)) return;
    const c=map[key]||(map[key]={key:key,name:o.customer_name,phone:o.phone,email:o.email,orders:[],spent:0,fav:{}});
    c.orders.push(o);c.spent+=Number(o.total||0);c.name=c.name||o.customer_name;
    (o.order_items||[]).forEach(i=>{c.fav[i.product_id]=(c.fav[i.product_id]||0)+Number(i.qty||0);});
  });
  return Object.values(map).map(c=>{
    c.last=c.orders.reduce((a,o)=>Math.max(a,+new Date(o.created_at)),0);
    const fk=Object.keys(c.fav).sort((a,b)=>c.fav[b]-c.fav[a])[0];c.favName=fk?pname(fk):'—';
    c.repeat=c.orders.length>=2;return c;
  }).sort((a,b)=>b.spent-a.spent);
}

/* =========================================================
   CSV
========================================================= */
function csv(name,rows){
  const cell=v=>{let s=String(v==null?'':v);if(/^[=+\-@]/.test(s)) s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+todayStr()+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('Downloaded '+name+'.csv','ok');
}

}
function beep(){
  try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.35);o.stop(a.currentTime+.36);}catch(_){}
}

/* ---------- charts ---------- */
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m||1))),f=m/p,nf=f<=1?1:f<=2?2:f<=5?5:10;return nf*p;}
function areaChart(data,label){
  const W=640,H=240,pl=46,pr=14,pt=14,pb=30,max=niceMax(Math.max.apply(null,data.map(d=>d.v).concat([1])));
  const x=i=>pl+(data.length<2?0:i*(W-pl-pr)/(data.length-1)),y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+='<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(pl-8)+'" y="'+(yy+3)+'" text-anchor="end">'+(v>=1000?(v/1000)+'k':Math.round(v))+'</text>';}
  const pts=data.map((d,i)=>x(i).toFixed(1)+','+y(d.v).toFixed(1));
  const step=Math.ceil(data.length/7);let xl='',dots='',hit='';
  data.forEach((d,i)=>{
    if(i%step===0||i===data.length-1) xl+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+fmtD(d.d)+'</text>';
    hit+='<rect x="'+(x(i)-(W-pl-pr)/(data.length*2))+'" y="'+pt+'" width="'+((W-pl-pr)/data.length)+'" height="'+(H-pt-pb)+'" fill="transparent"><title>'+fmtD(d.d,{weekday:'short',month:'short',day:'numeric'})+': '+peso(d.v)+' ('+d.n+' order'+(d.n===1?'':'s')+')</title></rect>';
    if(d.v>0) dots+='<circle cx="'+x(i)+'" cy="'+y(d.v)+'" r="3.5" fill="var(--surface)" stroke="var(--brand2)" stroke-width="2"/>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+E(label||'Sales chart')+'"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brand2)" stop-opacity="0"/></linearGradient></defs>'+g+
   '<polygon points="'+x(0)+','+y(0)+' '+pts.join(' ')+' '+x(data.length-1)+','+y(0)+'" fill="url(#ag)"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--brand2)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'+dots+xl+hit+'</svg>';
}
function donut(parts,center,sub){
  const R=54,C=2*Math.PI*R,tot=parts.reduce((a,p)=>a+p.value,0);let off=0,segs='';
  if(!tot) segs='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="16"/>';
  parts.forEach(p=>{const len=p.value/tot*C;segs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.color+'" stroke-width="16" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len;});
  return '<svg viewBox="0 0 140 140" style="width:150px;height:150px;display:block;margin:0 auto" role="img">'+segs+'<text x="70" y="68" text-anchor="middle" style="font-size:20px;font-weight:800;fill:var(--ink)">'+E(center)+'</text><text x="70" y="86" text-anchor="middle" style="font-size:9px;fill:var(--muted)">'+E(sub||'')+'</text></svg>';
}
function hbars(items){
  const max=Math.max.apply(null,items.map(i=>i.value).concat([1]));
  return '<div class="list">'+items.map(i=>'<div class="li" style="display:grid;gap:6px;padding:10px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:.88rem"><span style="font-weight:700">'+E(i.label)+'</span><span>'+E(i.text)+'</span></div><div class="bar"><i style="width:'+Math.max(2,i.value/max*100)+'%;background:'+(i.color||'var(--brand2)')+'"></i></div></div>').join('')+'</div>';
}

function posMeta(){

  const tend=P.tendered===''?T:Number(P.tendered),short=P.pay==='cash'&&P.tendered!==''&&(isNaN(tend)||tend<T);

async function completeSale(){
  const P=S.pos,L=posLines();if(!L.length||P.busy) return;
  const T=posTotal(),cash=P.pay==='cash',tend=P.tendered===''?T:Number(P.tendered);
  if(cash&&(isNaN(tend)||tend<T)){toast('Cash received is less than the total.','err');return;}
  P.busy=true;posMeta();
  try{
    const no=await api('rpc/place_order',{method:'POST',body:{p_name:P.name.trim()||'Walk-in customer',p_phone:P.phone.trim()||'N/A',p_email:null,p_address:null,p_delivery:'pickup',p_payment:cash?'cod':'gcash',p_ref:cash?null:(P.ref.trim()||null),p_notes:'POS sale',p_items:L.map(l=>({product_id:l.id,qty:l.q}))}});
    let warn='';
    try{
      const rows=await api('orders?order_no=eq.'+encodeURIComponent(no)+'&select=id'),id=rows&&rows[0]&&rows[0].id;
      if(!id) throw new Error('Could not find the new order.');
      await api('orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{payment_status:'Paid'}});
      await api('rpc/set_order_status',{method:'POST',body:{p_id:id,p_status:'Confirmed'}});

function nextInfo(o){
  switch(o.status){
    case 'New':return {to:'Confirmed',label:'Confirm'};
    case 'Confirmed':return {to:'Packed',label:'Mark packed'};
    case 'Packed':return o.delivery_method==='pickup'?{to:'Delivered',label:'Picked up'}:{to:'Shipped',label:o.delivery_method==='courier'?'Ship out':'Out for delivery'};
    case 'Shipped':return {to:'Delivered',label:'Delivered'};
  }
  return null;
}
function orderFilter(){
  const f=S.f,q=f.oQ.trim().toLowerCase();
  return S.orders.filter(o=>{
    if(f.oStatus==='Unpaid'){if(!(valid(o)&&o.payment_status!=='Paid')) return false;}
    else if(f.oStatus!=='All'&&o.status!==f.oStatus) return false;
    return !q||[o.order_no,o.customer_name,o.phone,o.address,itemsText(o)].join(' ').toLowerCase().indexOf(q)>-1;
  });
}
function orderRow(o){
  const n=nextInfo(o);
  return '<div class="orow" data-act="openOrder" data-id="'+E(o.id)+'"><div><div class="t">'+E(o.order_no)+'</div><div class="s">'+ago(o.created_at)+'</div></div><div class="cust"><div class="t">'+E(o.customer_name)+'</div><div class="s">'+E(o.phone)+' · '+E(o.delivery_method==='pickup'?'Pickup':o.delivery_method==='courier'?'Courier':'Local delivery')+'</div></div><div class="items"><div class="t" style="font-weight:600">'+E(itemsText(o))+'</div><div class="s">'+units(o)+' pack'+(units(o)===1?'':'s')+'</div></div><div class="amt"><div class="t">'+peso(o.total)+'</div><div class="s">'+payPill(o)+' '+E(o.payment_method==='gcash'?'GCash':'Cash')+'</div></div><div class="st">'+stPill(o.status)+(n?'<button class="btn sm" data-act="advance" data-id="'+E(o.id)+'">'+E(n.label)+'</button>':'')+'</div></div>';
}

  const rows=orderFilter();
  if(!rows.length) return '<div class="card">'+empty('orders','No orders found',S.orders.length?'Try a different search or filter.':'Orders from your website and POS will appear here.')+'</div>';

function expRange(){

}

function rpRange(){
  const f=S.f,now=new Date(),t0=sod(now),t1=addDays(t0,1),y=now.getFullYear(),m=now.getMonth();
  switch(f.rpRange){
    case 'today':return {from:t0,to:t1,label:'Today'};
    case '7':return {from:addDays(t0,-6),to:t1,label:'Last 7 days'};
    case 'month':return {from:new Date(y,m,1),to:t1,label:'This month'};
    case 'last':return {from:new Date(y,m-1,1),to:new Date(y,m,1),label:'Last month'};
    case 'custom':{const a=f.rpFrom?dateOnly(f.rpFrom):addDays(t0,-29),b=f.rpTo?addDays(dateOnly(f.rpTo),1):t1;return {from:a,to:b,label:fmtD(a)+' to '+fmtD(addDays(b,-1))};}
    default:return {from:addDays(t0,-29),to:t1,label:'Last 30 days'};
  }
}
function rpData(){
  const r=rpRange(),ord=S.orders.filter(o=>{const t=new Date(o.created_at);return valid(o)&&t>=r.from&&t<r.to;});
  const exp=S.expenses.filter(x=>{const t=dateOnly(x.spent_on);return t>=r.from&&t<r.to;});
  const rev=ord.reduce((a,o)=>a+Number(o.total||0),0),paid=ord.filter(o=>o.payment_status==='Paid').reduce((a,o)=>a+Number(o.total||0),0),ex=exp.reduce((a,x)=>a+Number(x.amount||0),0);
  const fl={},pay={},del={};
  ord.forEach(o=>{
    (o.order_items||[]).forEach(i=>{const k=i.product_id;fl[k]=fl[k]||{u:0,r:0};fl[k].u+=Number(i.qty||0);fl[k].r+=Number(i.qty||0)*Number(i.unit_price||0);});
    const pk=o.payment_method==='gcash'?'GCash / Maya':'Cash';pay[pk]=(pay[pk]||0)+Number(o.total||0);
    const dk2=o.delivery_method==='pickup'?'Pickup':o.delivery_method==='courier'?'Courier':'Local delivery';del[dk2]=(del[dk2]||0)+1;
  });
  const days=Math.min(92,Math.max(1,Math.round((r.to-r.from)/DAY)));
  return {r:r,ord:ord,exp:exp,rev:rev,paid:paid,ex:ex,profit:paid-ex,units:ord.reduce((a,o)=>a+units(o),0),fl:fl,pay:pay,del:del,series:dailySeries(days,r.from)};
}

function stockMove(id,dir){

  });
}

};
const CH={
  ingLevel:(v,el)=>guard(async()=>{await api('ingredients?id='+eq(el.dataset.id),{method:'PATCH',body:{reorder_level:Number(v)||0}});await refreshAfter('Reorder level saved');}),
  rpFrom:v=>{S.f.rpFrom=v;render();},rpTo:v=>{S.f.rpTo=v;render();}
};
document.addEventListener('click',e=>{
  if(e.target===$('#modal')){closeModal();return;}
  if(e.target===$('#scrim')){closeDrawer();return;}
  const p=e.target.closest('[data-pal]');if(p){palPick(p.dataset.pal);return;}
  if(e.target===$('#palette')){closePalette();return;}
  const b=e.target.closest('[data-act]');if(!b) return;
  const fn=A[b.dataset.act];if(fn) fn(b,e);
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k&&IN[k]) IN[k](e.target.value,e.target);});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k&&CH[k]) CH[k](e.target.value,e.target);});

/* =========================================================
   QUICK FIND (Ctrl/Cmd + K)
========================================================= */
function openPalette(){$('#palette').classList.add('on');const i=$('#palInput');i.value='';palRender('');setTimeout(()=>i.focus(),30);}
function closePalette(){$('#palette').classList.remove('on');}
function palRender(q){
  q=q.trim().toLowerCase();const out=[];
  const row=(k,ic,t,s)=>'<div class="pal-i" data-pal="'+k+'"><span class="alert-ic" style="--c:#3b82f6">'+ico(ic)+'</span><div style="min-width:0"><div class="t" style="font-weight:700">'+E(t)+'</div><div class="s muted" style="font-size:.8rem">'+E(s)+'</div></div></div>';
  if(!q){NAV.forEach(n=>out.push(row('tab:'+n.id,n.ic,'Go to '+n.label,'')));}
  else{
    S.orders.filter(o=>[o.order_no,o.customer_name,o.phone].join(' ').toLowerCase().indexOf(q)>-1).slice(0,5).forEach(o=>out.push(row('order:'+o.id,'orders',o.order_no+' · '+o.customer_name,peso(o.total)+' · '+o.status)));
    customers().filter(c=>[c.name,c.phone,c.email].join(' ').toLowerCase().indexOf(q)>-1).slice(0,4).forEach(c=>out.push(row('cust:'+c.key,'customers',c.name,c.orders.length+' orders · '+peso(c.spent))));
    S.inquiries.filter(x=>[x.full_name,x.email,x.message].join(' ').toLowerCase().indexOf(q)>-1).slice(0,3).forEach(x=>out.push(row('inq:'+x.id,'inquiries',x.full_name,x.inquiry_type+' · '+x.status)));
  }
  $('#palRes').innerHTML=out.join('')||'<div class="empty">No matches</div>';
}
function palPick(v){
  const i=v.indexOf(':'),t=v.slice(0,i),id=v.slice(i+1);closePalette();
  if(t==='tab') go(id);else if(t==='order') openOrder(id);else if(t==='cust') openCust(id);else if(t==='inq') openInq(id);
}
$('#palInput').addEventListener('input',e=>palRender(e.target.value));
$('#palInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('#palRes [data-pal]');if(f) palPick(f.dataset.pal);}});
$('#qfBtn').addEventListener('click',openPalette);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&SESSION){e.preventDefault();openPalette();return;}
  if(e.key==='Escape'){if($('#palette').classList.contains('on')) closePalette();else if($('#modal').classList.contains('on')) closeModal();else closeDrawer();}
});

/* =========================================================
   THEME, SOUND, REFRESH
========================================================= */
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(TKEY,t);}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');chrome();}
$('#themeBtn').addEventListener('click',toggleTheme);
$('#soundBtn').addEventListener('click',()=>{const off=localStorage.getItem(SNKEY)==='off';localStorage.setItem(SNKEY,off?'on':'off');chrome();toast(off?'New-order sound is on.':'New-order sound is off.');if(off) beep();});
$('#refreshBtn').addEventListener('click',()=>guard(async()=>{await loadAll();render();toast('Up to date','ok');}));
$('#logoutSide').addEventListener('click',()=>signOut());

/* =========================================================
   SIGN IN / OUT AND START
========================================================= */
function enter(){
  $('#login').hidden=true;$('#app').hidden=false;
  const hash=location.hash.replace('#/','');S.tab=NAV.some(n=>n.id===hash)?hash:'dash';
  S.loaded=false;render();
  loadAll().then(render).catch(e=>{toast(e.message,'err');S.loaded=true;render();});
  clearInterval(pollTimer);
  pollTimer=setInterval(poll,POLL_MS);
}
async function poll(){
  if(document.hidden||!SESSION||!S.loaded) return;
  try{
    await loadAll();chrome();
    const busy=S.drawer||$('#modal').classList.contains('on')||$('#palette').classList.contains('on');
    if(!busy&&['dash','orders','customers','reports'].indexOf(S.tab)>-1&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render();
  }catch(e){if(/expired|sign in/i.test(e.message)) signOut('Your session expired. Please sign in again.');}
}
function signOut(msg){
  const t=SESSION&&SESSION.access_token;
  if(t) fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t}}).catch(()=>{});
  clearSession();clearInterval(pollTimer);closeDrawer();closeModal();
  S.loaded=false;S.knownIds=null;S.orders=[];S.pos={cart:{},pay:'cash',tendered:'',name:'',phone:'',ref:'',busy:false};
  $('#app').hidden=true;$('#login').hidden=false;$('#loginForm').reset();
  if(msg){const e=$('#lErr');e.textContent=msg;e.hidden=false;}
  document.title='NuTriLeaf Console';
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const err=$('#lErr'),btn=$('#lBtn');err.hidden=true;btn.disabled=true;btn.textContent='Signing in...';
  try{
    const email=$('#lEmail').value.trim();
    if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()) throw new Error('This account does not have administrator access.');
    const j=await authCall('password',{email:email,password:$('#lPass').value});
    saveSession(j,$('#lRemember').checked);SESSION.email=email;saveSession({access_token:SESSION.access_token,refresh_token:SESSION.refresh_token,expires_at:SESSION.expires_at,user:{email:email}});
    enter();
  }catch(ex){err.textContent=ex.message;err.hidden=false;}
  finally{btn.disabled=false;btn.textContent='Sign in';}
});
window.addEventListener('hashchange',()=>{const t=location.hash.replace('#/','');if(SESSION&&NAV.some(n=>n.id===t)&&t!==S.tab) go(t);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden) poll();});

(async function boot(){
  setTheme(localStorage.getItem(TKEY)||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  SESSION=loadSession();
  if(SESSION&&SESSION.refresh_token){
    try{
      if(SESSION.expires_at-Date.now()/1000<60) await refreshToken();
      if(SESSION.email&&SESSION.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()) throw new Error('No access');
      enter();return;
    }catch(_){clearSession();}
  }
  $('#login').hidden=false;
})();

})();
</script>
</body>
</html>
